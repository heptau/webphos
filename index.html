<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="x-ua-compatible" content="IE=edge" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self' https://www.googleapis.com; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'self'; child-src 'self';" />
	<title>Lumifex - image editor</title>
	<meta name="description" content="Lumifex is a free online image editor using HTML5. Edit, adjust your images, add effects online in your browser, without installing anything..." />
	<meta name="keywords" content="photo, image, picture, transparent, layers, free, edit, html5, canvas, javascript, online, photoshop, gimp, effects, sharpen, blur, magic eraser tool, clone tool, rotate, resize, photoshop online, online tools, tilt shift, sprites, keypoints" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0" />
	<link rel="icon" type="image/png" sizes="192x192" href="images/manifest/192x192.png">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="images/manifest/192x192-maskable.png">
	<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#2a2a2c" media="(prefers-color-scheme: dark)">
	<!-- Google -->
	<meta itemprop="name" content="Lumifex" />
	<meta itemprop="description" content="Lumifex is a free online image editor using HTML5. Edit, adjust your images, add effects online in your browser, without installing anything..." />
	<!-- Twitter -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Lumifex" />
	<meta name="twitter:image" content="https://lumifex.80.cz/images/lumifex-preview.jpg" />
	<meta name="twitter:description" content="Lumifex is a free online image editor using HTML5. Edit, adjust your images, add effects online in your browser, without installing anything..." />
	<meta name="twitter:image:alt" content="Lumifex is a free online image editor using HTML5. Edit, adjust your images, add effects online in your browser, without installing anything..." />
	<!-- Facebook, Pinterest -->
	<meta property="og:title" content="Lumifex" />
	<meta property="og:image" content="https://lumifex.80.cz/images/lumifex-preview.jpg" />
	<meta property="og:url" content="https://lumifex.80.cz/" />
	<meta property="og:type" content="article" />
	<meta property="og:description" content="Lumifex is a free online image editor using HTML5. Edit, adjust your images, add effects online in your browser, without installing anything..." />
<meta property="og:site_name" content="Lumifex" />
	</head>
<body>
	<a class="skip_link trn" href="#main_wrapper">Skip to canvas</a>
	<div class="wrapper">
		<header class="app-header">
			<nav aria-label="Main Menu" class="main_menu" id="main_menu" role="navigation"></nav>

			<div class="submenu">
				<div class="block attributes" id="action_attributes" role="region" aria-label="Tool attributes"></div>
				<button class="undo_button" id="undo_button" type="button" aria-label="Undo last action">
					<span class="sr_only">Undo</span>
				</button>
			</div>
		</header>

		<main class="app-main">
			<aside class="sidebar_left" id="tools_container" role="complementary" aria-label="Drawing tools">
				<h2 class="sr_only">Drawing Tools</h2>
			</aside>

			<div class="documents_bar" id="documents_bar" role="tablist" aria-label="Documents"></div>

			<div class="middle_area" id="middle_area">
				<canvas class="ruler_left" id="ruler_left" aria-hidden="true"></canvas>
				<canvas class="ruler_top" id="ruler_top" aria-hidden="true"></canvas>

				<div class="main_wrapper" id="main_wrapper" tabindex="-1">
					<div class="canvas_wrapper" id="canvas_wrapper">
						<div id="mouse" aria-hidden="true"></div>
						<div class="transparent-grid" id="canvas_minipaint_background" aria-hidden="true"></div>
						<canvas id="canvas_minipaint" aria-label="Drawing canvas" role="application">
							<div class="trn error">
								Your browser does not support canvas or JavaScript is not enabled.
							</div>
						</canvas>
					</div>
				</div>
			</div>

			<aside class="sidebar_right" role="complementary" aria-label="Panels">
				<div class="preview block">
					<h2 class="trn toggle" data-target="toggle_preview" tabindex="0" role="button" aria-expanded="false" aria-controls="toggle_preview">Preview</h2>
					<div id="toggle_preview" role="region" aria-label="Canvas preview"></div>
				</div>

				<div class="histogram block" id="histogram_base">
					<h2 class="trn toggle toggle-full" data-target="toggle_histogram" tabindex="0" role="button" aria-expanded="false" aria-controls="toggle_histogram">Histogram</h2>
					<div class="content histogram-content" id="toggle_histogram" role="region" aria-label="Histogram"></div>
				</div>

				<div class="colors block">
					<h2 class="trn toggle" data-target="toggle_colors" tabindex="0" role="button" aria-expanded="false" aria-controls="toggle_colors">Colors</h2>
					<div class="content" id="toggle_colors" role="region" aria-label="Color palette"></div>
				</div>

				<div class="details block" id="details_base">
					<h2 class="trn toggle toggle-full" data-target="toggle_details" tabindex="0" role="button" aria-expanded="false" aria-controls="toggle_details">Layer details</h2>
					<div class="content details-content" id="toggle_details" role="region" aria-label="Layer properties"></div>
				</div>

				<div class="history block" id="history_base">
					<h2 class="trn toggle toggle-full" data-target="toggle_history" tabindex="0" role="button" aria-expanded="false" aria-controls="toggle_history">History</h2>
					<div class="content history-content" id="toggle_history" role="region" aria-label="History"></div>
				</div>

				<div class="layers block">
					<h2 class="trn">Layers</h2>
					<div class="content" id="layers_base" role="region" aria-label="Layer list"></div>
				</div>
			</aside>
		</main>
	<footer class="status_bar" id="status_bar" role="group" aria-label="Image information" aria-live="off"></footer>
	<footer class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button" aria-label="Toggle tools panel" aria-expanded="false" aria-controls="tools_container">
			<span class="sr_only">Toggle tools panel</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button" aria-label="Toggle panels" aria-expanded="false" aria-controls="sidebar_right">
			<span class="sr_only">Toggle panels</span>
		</button>
	</footer>
	<div class="hidden" id="tmp" aria-hidden="true"></div>
	<div id="popups" role="region" aria-label="Dialogs" aria-live="polite"></div>
</body>
</html>
